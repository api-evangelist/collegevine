name: Collegevine
description: >-
  CollegeVine is a Cambridge, Massachusetts company, backed by Menlo Ventures,
  that has repositioned itself as "the AI operating system for universities." Its
  platform pairs automated ingestion of data from campus systems (a Data layer)
  with a unified Ontology of institutional operations and an AI Operations layer
  of agents, applications, and ML models that connect directly to a university's
  CRM and admissions workflows. CollegeVine also operates a large consumer-facing
  college-admissions guidance property (chancing engine, essay guidance, and an
  AI counselor) at collegevine.com and blog.collegevine.com. As of this profile
  the company exposes no public developer API, OpenAPI specification, developer
  portal, or published SDK for its product; engagement is enterprise sales and
  demo driven. It does maintain an active public GitHub organization of
  open-source PureScript, Haskell, and TypeScript libraries.
